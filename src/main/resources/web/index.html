<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#33578f">
<title>PlanPal</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="mark">P</span>
    <span>PlanPal</span>
  </div>
  <button id="signout" class="link" hidden>Sign out</button>
</header>

<main id="main">

  <section id="login-screen" class="screen">
    <div class="card login-card">
      <h1>Welcome back</h1>
      <p class="muted">Sign in to keep planning.</p>
      <label for="username">Username</label>
      <input id="username" autocapitalize="none" autocomplete="username" inputmode="text">
      <label for="password">Password</label>
      <div class="password-row">
        <input id="password" type="password" autocomplete="current-password">
        <button id="reveal" class="ghost" type="button" aria-label="Show password">Show</button>
      </div>
      <p id="login-error" class="error" hidden></p>
      <button id="signin" class="primary">Log In</button>
    </div>
  </section>

  <section id="events-screen" class="screen" hidden>
    <h1 id="greeting"></h1>
    <p class="muted" id="event-count"></p>
    <div id="event-list"></div>
  </section>

  <section id="event-screen" class="screen" hidden>
    <button id="back" class="link back">‹ All trips</button>
    <h1 id="event-name"></h1>
    <p class="muted" id="event-meta"></p>

    <div class="stats" id="stats"></div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="expenses" role="tab">Expenses</button>
      <button class="tab" data-tab="activities" role="tab">Schedule</button>
      <button class="tab" data-tab="balances" role="tab">Balances</button>
    </nav>

    <div id="tab-expenses" class="tabpanel"></div>
    <div id="tab-activities" class="tabpanel" hidden></div>
    <div id="tab-balances" class="tabpanel" hidden></div>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
