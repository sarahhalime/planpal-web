<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#33578f">
<title>PlanPal</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="mark">P</span>
    <span>PlanPal</span>
  </div>
  <button id="signout" class="link" hidden>Sign out</button>
</header>

<main id="main">

  <section id="login-screen" class="screen">
    <div class="card login-card">
      <h1>Welcome back</h1>
      <p class="muted">Sign in to keep planning.</p>
      <label for="username">Username</label>
      <input id="username" autocapitalize="none" autocomplete="username" inputmode="text">
      <label for="password">Password</label>
      <div class="password-row">
        <input id="password" type="password" autocomplete="current-password">
        <button id="reveal" class="ghost" type="button" aria-label="Show password">Show</button>
      </div>
      <p id="login-error" class="error" hidden></p>
      <button id="signin" class="primary">Log In</button>
    </div>
  </section>

  <section id="events-screen" class="screen" hidden>
    <h1 id="greeting"></h1>
    <p class="muted" id="event-count"></p>
    <div id="event-list"></div>
  </section>

  <section id="event-screen" class="screen" hidden>
    <button id="back" class="link back">‹ All trips</button>

    <!-- Panels stack in the same order the desktop dashboard reads:
         header, budget summary, activities, expenses, who owes what. -->

    <div class="card panel" id="event-header">
      <h1 id="event-name"></h1>
      <p class="detail" id="event-description"></p>
      <p class="detail" id="event-location"></p>
      <p class="detail" id="event-dates"></p>
    </div>

    <div class="card panel">
      <div class="stats" id="stats"></div>
    </div>

    <div class="card panel">
      <h2 class="panel-title">Activities</h2>
      <div id="activity-list"></div>
    </div>

    <div class="card panel">
      <div class="panel-head">
        <h2 class="panel-title">Expenses</h2>
        <button id="add-toggle" class="add" aria-label="Add expense">+</button>
      </div>
      <div id="add-form" class="addform" hidden>
        <label for="ex-name">What was it for?</label>
        <input id="ex-name" placeholder="Dinner">
        <label for="ex-amount">Amount</label>
        <input id="ex-amount" type="number" inputmode="decimal" step="0.01" placeholder="42.50">
        <label for="ex-payer">Who paid?</label>
        <select id="ex-payer"></select>
        <label>Split between</label>
        <div id="ex-debtors" class="chips"></div>
        <p id="ex-error" class="error" hidden></p>
        <button id="ex-save" class="primary">Add expense</button>
      </div>
      <div id="expense-list"></div>
    </div>

    <div class="card panel">
      <div class="panel-head">
        <h2 class="panel-title">Itinerary</h2>
        <button id="itin-load" class="ghost small">Load</button>
      </div>
      <div id="itinerary-list"><p class="empty">Tap Load to build the timeline.</p></div>
    </div>

    <div class="card panel">
      <h2 class="panel-title">Who Owes What</h2>
      <p class="detail">Current balances by attendee.</p>
      <div id="balance-list"></div>
    </div>

    <div class="card panel">
      <h2 class="panel-title">Weather at Location</h2>
      <div id="weather"><p class="empty">Loading…</p></div>
    </div>

    <div class="card panel">
      <div class="panel-head">
        <h2 class="panel-title">Location Insights</h2>
        <span class="detail nowrap">AI-generated estimates</span>
      </div>
      <div id="insight"><p class="empty">Loading…</p></div>
    </div>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
